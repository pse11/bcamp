<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link type="text/css" rel="stylesheet" href="./main_css.css" />
</head>
<body>
    <div id="header">
        <div id="topmenu">
            <div id="logo"><h1>MLP</h1></div>
            <div id="search"><input type="search" name="search" placeholder="관심있는 주제, 키워드로 검색해보세요."></div>
            <div id="icons">
                <span>➕</span>
                <span>🔔</span>
                <span>👤</span>
            </div>
        </div>
        <div id="menubar">
            <ul class="nav_menu">
                <li><a href="">🟰&nbsp;&nbsp;카테고리</a></li>
                <li><a href="">피드</a></li>
                <li><a href="">지식콘텐츠</a></li>
                <li><a href="">캠퍼스</a></li>
                <li><a href="">나의학습</a></li>
            </ul>
        </div>
    </div>
    <div id="content">
        <div id="leftContent">
            <div id="profile">
                <div id="ptop">
                    <div id="pimg">👤</div>
                    <div id="pname">
                        <h3>박상은</h3>
                        <p>[현대이지웰] Java 풀스택 개발자 아카데미 5회차 . K-디지털</p>
                    </div>
                </div>
                <div id="pbottom">
                    <p>팔로워 0 | 팔로잉 0</p>
                    <span>☺️👻</span>
                    <button>프로필 수정</button>
                </div>
            </div>
            <div id="feed">
                <ul>
                    <li>전체 피드</li>
                    <li>📢알려드립니다!</li>
                    <li>우리회사 피드</li>
                    <li>팔로잉 피드</li>
                    <li>캠퍼스 피드</li>
                    <li>내가 작성한 피드</li>
                    <li>저장한 피드</li>
                </ul>
            </div>
            <div id="recommend">
                <div id="rtop">
                    <span><b>친구 추천</b></span>
                    <span class="right">&gt;</span>
                    <span class="right">&lt; </span>
                    
                </div>
                <div id="rbottom">
                    <div class="rfriend"></div>
                    <div class="rfriend"></div>
                </div>
            </div>
        </div>
        <div id="rightContent">
            <div id="feedheader">
                <span><b>전체 피드</b></span>
                <button>+ 피드작성</button>
                <div id="feedSearch">
                    <input type="search" name="feedsearch" placeholder="검색어를 입력해주세요.">
                    <select name="orderby">
                        <option value="recent">최신순</option>
                        <option value="check">조회순</option>
                        <option value="like">좋아요순</option>
                        <option value="comment">댓글순</option>
                    </select>
                
                </div>
            </div>
            <div id="feedContent">
                <img src="feed.png" alt="feed">
                <img src="feed.png" alt="feed">
                <img src="feed.png" alt="feed">
            </div>
        </div>
    </div>
</body>
</html>
