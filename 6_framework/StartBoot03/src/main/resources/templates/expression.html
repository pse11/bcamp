<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>expression</h1>
	<p th:text="'Hello, '+${name}">Hello, $name</p>
	<!-- th:text에 우선권이 있어서 p태그의 inner text가 작성되어있어도 th:text에 동적으로 넣어주는 값이 화면에 출력된다. -->
	<!-- th:text가 작동하지 않는 환경(IDE 미리보기 등)에서는 Hello, $name이 보이지만 실제 렌더링 시에는 평가된 표현식('Hello, '+${name}" 결과로 덮어씀 -->
	<p th:text="|Hello, ${name}|">Hello, $name</p>
	<!-- | 는 js에서 ``백틱 문법과 같은 형태라고 생각할것. -->
	<hr>
	<p th:text="|${dto.subject} , ${dto.seq}|">dto.subject</p>
	
	<div th:object="${dto}"> <!-- object를 통해서 객체를 보다 쉽게 참조할 때 활용할 수 있음 -->
		<p th:text="*{subject}">subject</p> <!-- 위에서 설정한 ${dto}를  *사용하여  참조 : ${dto.subject}인것-->
		<p th:text="*{seq}">seq</p>
	</div>
	
	<form th:object="${dto}">
		<input type="text" th:field="*{subject}">
		<input type="text" th:field="*{seq}">
	</form>
	
	<hr>
	<table>
		<tr>
			<th>Subject</th>
			<th>Seq</th>
		</tr>
		<tr th:each="dto:${list}" th:object="${dto}"><!-- list를 dto에 하나씩 꺼내오겠다. -->
			<td th:text="*{subject}">과목</td>
			<td th:text="${dto.seq}">번호</td>
		</tr>
	</table>
	<hr>
	<div th:object="${dto}">
		<p th:if="*{seq gt 30}">
			<span>seq가 10보다 크다</span>
		</p><!-- seq > 10 을 의미 -->
		<p th:unless="*{seq gt 30}">
			<span>seq가 30보다 작다</span>
		</p>
	</div>
	&gt; &lt; &ge; &le; &eq;같다, &ne;같지 않다.<!-- > 의미 -->
	
	<hr>
	<div th:each="num:${#numbers.sequence(1,3)}">
		<th:block th:switch="${num}">
			<p th:case="1" th:text="|this tis ${num}|">
			<p th:case="2" th:text="|second ${num}">
			<p th:case="3" th:text="|bye ${num}|">
		</th:block>
	</div>
	
	<hr>
	<a th:href="@{/}">index</a>
	<a th:href="@{/test(seq=${dto.seq})}">test</a><!-- 파라미터도 넘겨준다.
						/test?seq=22 -->
						
	<form th:object="${dto}" th:action="@{/test}">
		<input type="text" th:field="*{subject}">
		<input type="text" th:field="*{seq}">
		<input type="submit" value="확인">
	</form>
	<!-- /test?subject=Java&seq=22
	 -->
						
</body>
</html>
